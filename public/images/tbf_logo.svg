<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich Forest Green Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3A2A"/>
      <stop offset="50%" stop-color="#16281E"/>
      <stop offset="100%" stop-color="#0E1A13"/>
    </linearGradient>

    <!-- Warm Sand Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8BA"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9C7847"/>
    </linearGradient>

    <!-- Soft Shadow for text and crown -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Luxury Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.95"/>
  
  <!-- Inner Delicate Hairline Border -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Royal Bridal Tiara / Crown -->
  <g transform="translate(64, 30) scale(0.92)" filter="url(#subtleShadow)">
    <circle cx="0" cy="-9" r="2.8" fill="#FFFFFF"/>
    <circle cx="-16" cy="-5" r="2" fill="#FFFFFF"/>
    <circle cx="16" cy="-5" r="2" fill="#FFFFFF"/>
    <path d="M -22 6 L -16 -4 L -7 2 L 0 -8 L 7 2 L 16 -4 L 22 6 Z" fill="url(#goldGrad)"/>
    <path d="M -22 6 Q 0 11 22 6 L 20 9 Q 0 14 -20 9 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Monogram TBF (The Beauty Factory) -->
  <text x="64" y="79" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="2.5" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        filter="url(#subtleShadow)">TBF</text>

  <!-- Subtitle: DR. BHANU -->
  <text x="64" y="96" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="800" 
        letter-spacing="2.8" 
        text-anchor="middle" 
        fill="url(#goldGrad)">DR. BHANU</text>

  <!-- Bottom Accent Curve -->
  <path d="M 40 105 Q 64 108 88 105" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.75"/>
  <circle cx="64" cy="106.5" r="1.5" fill="url(#goldGrad)"/>
</svg>
